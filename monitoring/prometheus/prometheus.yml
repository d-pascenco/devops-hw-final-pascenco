global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: [localhost:9090]

  # сбор метрик сервиса через nginx (сам сервис портов наружу не публикует)
  - job_name: audit-svc
    metrics_path: /metrics
    static_configs:
      - targets: [deploy-vm:8080]
        labels:
          instance: deploy-vm

  - job_name: nginx
    static_configs:
      - targets: [deploy-vm:9113]
        labels:
          instance: deploy-vm
