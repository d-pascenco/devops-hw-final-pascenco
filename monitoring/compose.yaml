# Prometheus подключён к сети lab для сбора метрик с deploy-vm:8080 (nginx -> /metrics) и :9113 (nginx-exporter)
# отдельное имя проекта audit-monitoring, чтобы не конфликтовать с другими контейнерами
name: audit-monitoring

services:
  prometheus:
    image: prom/prometheus:v3.5.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
    volumes:
      - ./prometheus:/etc/prometheus:ro
      - prometheus-data:/prometheus
    ports:
      - 127.0.0.1:9090:9090
    networks: [lab]
    restart: unless-stopped

  grafana:
    image: grafana/grafana:12.1.0
    volumes:
      - grafana-data:/var/lib/grafana
    ports:
      - 127.0.0.1:3000:3000
    networks: [lab]
    restart: unless-stopped

networks:
  lab:
    external: true

volumes:
  prometheus-data:
  grafana-data:
